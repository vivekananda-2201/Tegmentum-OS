# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/tegmentum/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]
[alacritty]
input  = "~/.config/tegmentum/templates/alacritty.toml"
output = "~/.config/alacritty/colors.toml"
[rofi]
input  = "~/.config/tegmentum/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"
[hyprlock]
input  = "~/.config/tegmentum/templates/hyprlock-colors.conf"
output = "~/.config/hypr/hyprlock-colors.conf"
[gtk3]
input  = "~/.config/tegmentum/templates/gtk-colors.css"
output = "~/.config/gtk-3.0/colors.css"
[gtk4]
input  = "~/.config/tegmentum/templates/gtk-colors.css"
output = "~/.config/gtk-4.0/colors.css"
[quickshell]
input  = "~/.config/tegmentum/templates/quickshell-theme.json"
output = "~/.cache/tegmentum/quickshell-theme.json"
[btop]
input  = "~/.config/tegmentum/templates/btop.theme"
output = "~/.config/btop/themes/tegmentum.theme"
